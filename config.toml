# ======================客户端配置==================================

[client]
speech_recognition_shortcut = "f15"
# 控制录音的快捷键，默认是 "caps lock"

toggle_textbox_context_shortcut = ""
# 快速切换 LLM 润色时是否附加当前文本框上下文；设为空字符串可禁用

threshold = 0.3
# 录音时长低于此阈值时取消任务

paste = true
# 是否以写入剪切板然后模拟 Ctrl-V 粘贴的方式输出结果

restore_clipboard_after_paste = false
# 模拟粘贴后是否恢复剪贴板
# 设为 false 时，识别结果会保留在剪贴板中，Ditto 可捕捉，之后 Ctrl+V 也能继续粘贴

# 实验功能：把润色开启时的 ASR/LLM full-text revision 发送给 TSF Speech TIP，
# 由目标文本框中的 Composition 承载临时文本。必须先构建、注册并启用原生 TIP。
tsf_speech_tip_enabled = true

# 首次 BEGIN 等待前台 TIP 确认接管的时间；超时后该次输入安全回退到现有键盘/粘贴路径。
tsf_speech_tip_ack_timeout_ms = 150

# 只读获取光标邻域上下文可等待更久；超时后回退到 UI Automation。
tsf_speech_tip_context_timeout_ms = 500

daily_input_log_interval = 1000
# 今日累计上屏字符数每达到此值时写入一条诊断日志；最小值为 1

save_audio = false
# 是否保存录音文件

save_markdown = false
# 是否将记录写入 Markdown 文件

audio_name_len = 20
# 将录音识别结果的前多少个字存储到录音文件名中，建议不要超过 200

reduce_audio_files = true
# 如果用户已安装 ffmpeg，调用 ffmpeg 录音时输出 mp3 格式的音频文件，大大减小文件体积，减少磁盘占用

trash_punc = "，。,."
# 识别结果要消除的末尾标点

mute_other_audio = true
# 录音时是否静音其他音频播放

pause_other_audio = true
# 录音时是否暂停其他音频播放

shrink_automatically_to_tray = false
# 启动后是否自动缩小至托盘

only_run_once = true
# 只允许运行一次，禁止多开

only_enable_microphones_when_pressed_record_shortcut = true
# 只在按下录音快捷键时启用麦克风
# 建议启用，有些蓝牙耳机录音时无法播放
# 而且启用后，切换默认麦克风也不用重启客户端
# 比如从蓝牙耳机换回笔记本电脑默认麦克风
# 缺点就是输入的时候可能会慢些
# 毕竟要先建立与麦克风的连接

play_start_music = true
# 开始任务时是否播放提示音
# 需要 ffplay.exe

start_music_path = "assets/SpeechOn.mp3"
# 开始任务提示音的文件路径

start_music_volume = "100"
# 开始任务提示音的音量，0 ~ 100 之间

play_stop_music = true
# 结束任务时是否播放提示音
# 需要 ffplay.exe

stop_music_path = "assets/SpeechOff.mp3"
# 结束任务提示音的文件路径

stop_music_volume = "100"
# 结束任务提示音的音量，0 ~ 100 之间

show_listening_overlay = true
# 录音时是否在当前鼠标所在显示器下方居中显示“正在监听”悬浮窗



check_microphone_usage_by = "注册表"
# "按键" 或 "注册表"
# 默认通过监测注册表判断麦克风是否在被客户端使用进而确定是否在录音
# 如果设置了 `only_enable_microphones_when_pressed_record_shortcut = false`
# 会造成的鼠标光标旁边永远显示麦克风标志
# 将强制忽略此项设置使用 "按键"
# "按键" 是通过监测 `speech_recognition_shortcut` 状态是否按下进而推测是否在录音
