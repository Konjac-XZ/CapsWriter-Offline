[project]
name = "capswriter-offline"
version = "1.0.0"
description = "Cloud-backed transcription tool for Windows"
requires-python = ">=3.11,<3.14"
dependencies = [
    "rich==13.9.3",
    "keyboard==0.13.5",
    "clipman==3.3.1",
    "numpy==1.26.4",
    "sounddevice==0.5.1",
    "websockets==13.1",
    "pypinyin==0.53.0",
    "watchdog==5.0.3",
    "typer==0.12.5",
    "srt==3.5.3",
    "httpx[http2]>=0.28.1,<0.29",
    "httpx-sse>=0.4.0,<0.5",
    "openrouter>=1.1.24,<2",
    "pyside6>=6.8,<6.9",
    "qt-material==2.14",
    "comtypes==1.4.13",
    "pycaw==20240210",
    "pywin32==308",
    "qrcode==7.4.2",
    "tomlkit==0.13.2",
    "python-dotenv==1.0.1",
    "pangu==4.0.6.1",
    "replicate==0.31.0",
    "PyYAML==6.0.2",
    "dashscope>=1.25.3",
    "cn2an>=0.5.23",
    "ruff>=0.15.10",
    "ty>=0.0.29",
    "qtmonaco[pyside6]>=0.8.4",
    "pyright>=1.1.409",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
profiling = [
    "pyinstrument>=5.0.0",
    "viztracer>=0.16.3",
    "yappi>=1.7.3",
    "snakeviz>=2.2.2",
]

[tool.pytest.ini_options]
addopts = "-s"
pythonpath = ["."]

[[tool.ty.overrides]]
include = ["start_client_gui.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
unresolved-import = "ignore"
unresolved-global = "ignore"

[[tool.ty.overrides]]
include = ["src/polish/vision_context.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
unresolved-import = "ignore"
invalid-assignment = "ignore"
invalid-argument-type = "ignore"
