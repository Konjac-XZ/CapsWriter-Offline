[project]
name = "capswriter-offline"
version = "1.0.0"
description = "Cloud-backed transcription tool for Windows"
requires-python = ">=3.11,<3.14"
dependencies = [
    "rich==13.9.3",
    "keyboard==0.13.5",
    "clipman==3.3.1",
    "numpy==1.26.4",
    "sounddevice==0.5.1",
    "websockets==13.1",
    "pypinyin==0.53.0",
    "watchdog==5.0.3",
    "typer==0.12.5",
    "srt==3.5.3",
    "httpx[http2]==0.27.2",
    "PySide6==6.7.1",
    "qt-material==2.14",
    "pycaw==20240210",
    "pywin32==308",
    "qrcode==7.4.2",
    "opencc==1.1.9",
    "tomlkit==0.13.2",
    "python-dotenv==1.0.1",
    "pangu==4.0.6.1",
    "replicate==0.31.0",
    "PyYAML==6.0.2",
    "dashscope>=1.25.3",
    "cn2an>=0.5.23",
]

[dependency-groups]
dev = []
profiling = [
    "pyinstrument>=5.0.0",
    "viztracer>=0.16.3",
    "yappi>=1.7.3",
    "snakeviz>=2.2.2",
]

